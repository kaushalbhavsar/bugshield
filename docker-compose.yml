services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bugshield
      POSTGRES_PASSWORD: bugshield
      POSTGRES_DB: bugshield
    volumes:
      - bugshield_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugshield"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://bugshield:bugshield@db:5432/bugshield
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

  agent:
    build:
      context: ./backend
    profiles: ["agent"]
    environment:
      DATABASE_URL: postgresql+psycopg://bugshield:bugshield@db:5432/bugshield
    command: ["python", "-m", "app.agent", "--config", "/config/agent.json"]
    volumes:
      - ./deploy/agent.example.json:/config/agent.json:ro
      - ./backend/tests/fixtures:/logs:ro
    depends_on:
      - api

volumes:
  bugshield_db:
